version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: develop
    commit-message:
      prefix: fix

  # Maintain dependencies for java
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: develop
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
